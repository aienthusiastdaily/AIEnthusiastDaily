<title id="title">Input tokens per call versus recorded events across three individual runs</title>
<desc id="desc">An older GPT-5.4 mini run has its last measured call at event 237 and 114,624 input tokens, then stops without accepted completion. Two simplified-harness runs each passed host checks, saved and reread 20 jobs: GPT-5.6 Terra at event 52 and 38,995 input tokens, and one fresh full GPT-5.4 trial at event 40 and 45,427 input tokens. These are individual runs with different models, harnesses and task contracts, not a controlled benchmark or reliability estimate.</desc>
